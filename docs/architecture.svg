<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="1140" height="640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Architecture: Loan Origination System on Exasol</title>
<desc id="d">A browser opens the console on dash-server. The console calls the LOS service on 127.0.0.1:8527, which accepts named operations only. The service sends PDFs to Amazon Textract (optional), stores uploads in the MongoDB document store, and runs SQL on Exasol as three least-privilege logins. Inside the Exasol Personal VM, Exasol reads core banking on Postgres 16 through a JDBC virtual schema, the document store on MongoDB 8.2 through a Rust-adapter virtual schema, and the mock credit report API through a Python UDF whose key is in a CONNECTION.</desc>
